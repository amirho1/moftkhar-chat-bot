name: Build optional router compatibility image
on:
  workflow_dispatch:
    inputs:
      base_image:
        description: Reviewed existing router image at immutable digest
        required: true
        type: string
      ide_version:
        description: Verified official standalone IDE version
        required: true
        type: string
      cli_version:
        description: Verified official CLI version
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Validate immutable base and explicit versions
        env:
          BASE: ${{ inputs.base_image }}
          IDE: ${{ inputs.ide_version }}
          CLI: ${{ inputs.cli_version }}
        run: |
          node --input-type=module <<'JS'
          if (!/^[a-z0-9./_-]+@sha256:[a-f0-9]{64}$/.test(process.env.BASE) || ![process.env.IDE,process.env.CLI].every(v=>/^\d+\.\d+\.\d+$/.test(v))) throw Error('Invalid immutable base or client version');
          JS
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Build and syntax-check without production secrets or data
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./ops/omniroute-client-version
          file: ops/omniroute-client-version/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/${{ github.repository }}/router-compatibility:${{ github.sha }}
          build-args: |
            BASE_IMAGE=${{ inputs.base_image }}
            IDE_VERSION=${{ inputs.ide_version }}
            CLI_VERSION=${{ inputs.cli_version }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish after successful checks
        env:
          IMAGE: ghcr.io/${{ github.repository }}/router-compatibility:${{ github.sha }}
        run: |
          docker push "$IMAGE"
          docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
